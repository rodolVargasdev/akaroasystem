<!-- fragments/header.html -->
<div th:fragment="headerFragment(title)">
<!--  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css">-->
  <div class="sidebar d-flex flex-column">

    <!-- Logo -->
    <a th:href="@{/index}" class="nav-link">
      <img th:src="@{img/logo_akaroa_removebg.png}" alt="Sistema Akaroa Logo" class="mb-4 img-fluid w-50"/>
    </a>

    <!-- Header con título dinámico -->
    <header class="ml-2">
      <h3 th:text="${#authentication.principal.nombreCompleto}">Usuario</h3>
      <h3 th:text="${#authentication.principal.rolTraducido}">Rol</h3>
      <hr>
    </header>
    <header>
      <h4>Productos</h4>
    </header>
    <!-- Sidebar links -->
    <nav class="nav flex-column">
      <a th:href="@{/productos}" class="nav-link">
        <i class="bi bi-basket"></i> Gestion de Productos
      </a>
      <a th:href="@{/atributos}" class="nav-link">
        <i class="bi bi-tags"></i> Gestión de Atributos
      </a>
      <a th:href="@{/lotes}" class="nav-link">
        <i class="bi bi-box-seam"></i> Gestión de Lotes
      </a>
      <header>
        <hr>
        <h4>Contactos</h4>
      </header>
      <a th:href="@{/proveedores}" class="nav-link">
        <i class="bi bi-truck"></i> Gestión de Proveedores
      </a>
      <a th:href="@{/clientes}" class="nav-link">
        <i class="bi bi-people"></i> Gestión de Clientes
      </a>
      <header>
        <hr>
        <h4>Ventas</h4>
      </header>
      <a th:href="@{/registrarventa}" class="nav-link">
        <i class="bi bi-cart"></i> Administar Ventas
      </a>
      <a th:href="@{/listaventas}" class="nav-link">
        <i class="bi bi-receipt"></i> Detalles de ventas
      </a>
      <header>
        <hr>
        <h4>Reportes</h4>
      </header>
      <a th:href="@{/reportes/ventas}" class="nav-link">
        <i class="bi bi-file-earmark"></i> Reportes
      </a>
      <header>
        <hr>
        <h4>Usuarios</h4>
      </header>
<!--      <a th:href="@{/usuario}" class="nav-link">-->
<!--        <i class="bi bi-people"></i> Configuración de usuario-->
<!--      </a>-->
      <a th:href="@{/registrousuario}" class="nav-link">
        <i class="bi bi-pencil-square"></i> Registro de usuarios
      </a>
      <a th:href="@{/logout}" class="nav-link">
        <i class="bi bi-box-arrow-left"></i> Cerrar sesión
      </a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</div>
