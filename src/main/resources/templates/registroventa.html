<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Registro de ventas</title>
</head>
<body>
<div th:insert="~{fragments/header :: headerFragment(title='Administrador')}"></div>
<main class="main-productos-container" style="padding-left: 350px">
    <div class="registro-main-container">
        <div class="registro-title-container">
            <h1>Registro de ventas</h1>
        </div>
        <!--form registro de ventas -->
        <div class="registro-form-background">
            <div class="registro-main-container">
                <div class="registro-title-container">
                    <h3>Registrar nueva venta</h3>
                </div>
                <form action="#" th:action="@{/registrarventa/guardar}" th:object="${ventaForm}" id="ventaForm" method="post">
                    <div class="registro-form-container">
                        <div class="registro-form-tipousuario">
                            <label for="productoVenta" class="registro-form-label">Seleccion de cliente</label>
                            <select th:field="*{clienteId}" id="productoVenta" name="clienteVenta" required>
                                <option value="" selected>Seleccione un cliente</option>
                                <option th:each="cliente: ${listarClientes}"
                                        th:value="${cliente.idCliente}"
                                        th:text="${cliente.nombreCliente}">
                                </option>
                            </select>
                        </div>
                        <div class="registro-form-email">
                            <label for="fechaVenta" class="registro-form-label">Fecha de venta</label>
                            <input type="date" id="fechaVenta" th:field="*{fechaVenta}" required
                                   pattern="\d{4}-\d{2}-\d{2}" placeholder="YYYY-MM-DD">
                            <small class="text-danger" th:if="${#fields.hasErrors('fechaVenta')}"
                                   th:errors="*{fechaVenta}">Error en fecha</small>
                        </div>
                        <div class="registro-form-usuario">
                            <label for="vendedor" class="registro-form-label">Vendedor</label>
                            <input type="text" class="registro-form-input" id="vendedor"
                                   th:value="${nombreCompleto}" readonly>
                            <input type="hidden" th:field="*{usuarioId}">
                        </div>
                        <div class="row g-3">
                            <label class="registro-form-label">Selección de productos</label>
                            <div class="col-md-6">
                                <label for="producto" class="form-label">Seleccione un producto</label>
                                <select class="form-select" id="producto">
                                    <option value="">Seleccione un producto</option>
                                    <option th:each="producto : ${listarProductos}"
                                            th:value="${producto.idProducto}"
                                            th:text="${producto.nombreProducto}"
                                            th:data-precio="${producto.precio}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label for="cantidad" class="form-label">Cantidad</label>
                                <input type="number" id="cantidad" min="1" value="1">
                            </div>
                            <div class="col-md-2">
                                <label for="precioUnitario" class="form-label">Precio Unitario</label>
                                <input type="text" class="form-control" id="precioUnitario" readonly>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" class="btn btn-primary" id="agregarProducto" disabled>
                                    <i class="bi bi-plus-circle"></i> Agregar
                                </button>
                            </div>
                        </div>
                        <table class="product-table mt-4" id="tablaProductos">
                            <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Cantidad</th>
                                <th>Precio Unitario</th>
                                <th>Subtotal</th>
                                <th>Acciones</th>
                            </tr>
                            </thead>
                            <tbody>
                            <!-- Los productos agregados aparecerán aquí -->
                            </tbody>
                        </table>
                        <div class="total-section">
                            <span>Total a pagar: $</span>
                            <span id="totalVenta">0.00</span>
                        </div>
                        <!-- campos ocultos para los detalles -->
                        <div id="detallesContainer">
                            <!-- Se generarán dinámicamente -->
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                            <button type="submit" class="btn btn-success" id="guardarVenta" disabled>
                                <i class="bi bi-save"></i> Guardar Venta
                            </button>
                        </div>
                    </div>
                </form>
                <!-- mensajes de error/exito -->
                <div th:if="${success}" class="alert alert-success mt-3" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${success}">Mensaje de éxito</span>
                </div>
                <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}">Mensaje de error</span>
                </div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/registroventa.js}"></script>
</body>
</html>
