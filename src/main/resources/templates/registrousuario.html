<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Registro de usuarios</title>
</head>
<body>
<div th:replace="fragments/header :: headerFragment (title='Administrador')"></div>
<main class="main-productos-container" style="padding-left: 350px">
    <div class="registro-main-container">
        <div class="registro-title-container">
            <h1>Gestionar usuarios</h1>
        </div>
        <div class="registro-form-background">
            <div class="registro-main-container">
                <div class="registro-title-container">
                    <h3>Registrar nuevo usuario</h3>
                </div>
                <form action="#" th:action="@{/registrousuario/guardar}" th:object="${usuario}" method="post">
                    <div class="registro-form-container">
                        <div class="registro-form-nombres">
                            <label for="registro-nombres" class="registro-form-label">Nombre y apellido</label>
                            <input type="text" placeholder="Ingrese nombre y apellido" th:field="*{nombreCompleto}"
                                   name="registro-nombres"
                                   id="registro-nombres" required>
                        </div>
                        <div class="registro-form-tipousuario">
                            <label for="registro-tipousuario" class="registro-form-label">Tipo de usuario</label>
                            <select th:field="*{idRol.idRol}" id="registro-tipousuario" required>
                                <option value="" selected>Seleccione un tipo de usuario</option>
                                <option th:each="rol : ${roles}" th:value="${rol.idRol}"
                                        th:text="${rol.nombreRole == 'ADMIN' ? 'Administrador' : (rol.nombreRole == 'MANAGER' ? 'Gerente' : (rol.nombreRole == 'SELLER' ? 'Vendedor' : rol.nombreRole))}"></option>
                            </select>
                        </div>
                        <div class="registro-form-email">
                            <label for="registro-email" class="registro-form-label">Correo electrónico</label>
                            <input type="email" placeholder="Ingrese correo electrónico" th:field="*{email}"
                                   name="registro-email"
                                   id="registro-email" required>
                        </div>
                        <div class="registro-form-usuario">
                            <label for="registro-usuario" class="registro-form-label">Usuario</label>
                            <input type="text" placeholder="Ingrese usuario" th:field="*{nombreUsuario}"
                                   name="registro-usuario"
                                   id="registro-usuario" required>
                        </div>
                        <div class="registro-form-password">
                            <label for="registro-password" class="registro-form-label">Contraseña</label>
                            <input type="password" placeholder="Ingrese contraseña" th:field="*{password}"
                                   name="registro-password"
                                   id="registro-password" required>
                        </div>
                        <div class="registro-form-password">
                            <label for="registro-password2" class="registro-form-label">Repetir contraseña</label>
                            <input type="password" placeholder="Repetir contraseña" th:field="*{confirmPassword}"
                                   name="registro-password2"
                                   id="registro-password2" required>
                        </div>
                        <!--                        <div th:if="${error}" class="alert alert-danger ">-->
                        <!--                            <p th:text="${error}"></p>-->
                        <!--                        </div>-->
                        <div class="registro-form-button">
                            <button type="submit">Ingresar nuevo usuario</button>
                        </div>
                    </div>
                </form>
                <div th:if="${success}" class="alert alert-success">
                    <p th:text="${success}"></p>
                </div>
                <div th:if="${error}" class="alert alert-danger">
                    <p th:text="${error}"></p>
                </div>
            </div>
            <div class="product-searchProduct-container">
                <div class="registro-main-container">
                    <div class="registro-title-container">
                        <h3>Buscar usuarios</h3>
                        <div class="producto-searcher-container">
                            <input type="search" placeholder="Busqueda por nombre o correo">
                        </div>
                    </div>
                </div>
                <div class="product-products-container">
                    <div th:each="usuario, iterStat: ${listarUsuarios}" class="product-card-container">
                        <div class="product-card-information">
                            <!--                            <img src="" alt="imagen usuario">-->
                            <div>
                                <h4 th:text="${usuario.nombreCompleto}"></h4>
                                <hr>
                                <span th:text="'Usuario: ' + ${usuario.nombreUsuario}"></span>
                                <br>
                                <span th:text="'Email: ' + ${usuario.email}"></span>
                                <br>
                                <span th:text="'Rol: ' +
                                (${usuario.idRol.nombreRole == 'ADMIN' ? 'Administrador' :
                                (usuario.idRol.nombreRole == 'MANAGER' ? 'Gerente' :
                                (usuario.idRol.nombreRole == 'SELLER' ? 'Vendedor' : usuario.idRol.nombreRole))})"></span>
                            </div>
                        </div>
                        <br>
                        <div class="product-card-actions">
                            <div class="product-action-edit" data-bs-toggle="modal" data-bs-target="#exampleModal"
                                 th:data-id="${usuario.getIdUsuario()}">
                                <span>Editar</span>
                                <i class="bi bi-pencil-square"></i>
                            </div>
                            <div class="product-action-delete" data-bs-toggle="modal" data-bs-target="#exampleModal2"
                                 th:data-id="${usuario.getIdUsuario()}">
                                <span>Eliminar</span>
                                <i class="bi bi-trash-fill"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal para edición de Usuario -->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="editUserModalLabel"
                 aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="editUserModalLabel">Editar Usuario</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <form id="editUserForm" method="post">
                                <input type="hidden" id="editIdUsuario" name="idUsuario">
                                <div class="mb-3">
                                    <label for="editNombreUsuario" class="form-label">Nombre usuario</label>
                                    <input type="text" class="form-control" id="editNombreUsuario"
                                           th:value="${usuario.nombreUsuario}" name="nombreUsuario">
                                </div>
                                <div class="mb-3">
                                    <label for="editEmailUsuario" class="form-label">Email</label>
                                    <input type="text" class="form-control" id="editEmailUsuario" name="email">
                                </div>
                                <div class="mb-3">
                                    <label for="editPasswordUsuario" class="form-label">Contraseña</label>
                                    <input type="password" class="form-control" id="editPasswordUsuario"
                                           name="password">
                                </div>
                                <div class="mb-3">
                                    <label for="editRolUsuario" class="form-label">Rol</label>
                                    <!--                                    <input type="text" class="form-control" id="editRolUsuario" name="idRol">-->
                                    <select class="form-select" name="idRol" id="editRolUsuario">
                                        <option value="" disabled selected>Seleccionar Rol</option>
                                        <option value="1">Administrador</option>
                                        <option value="2">Gerente</option>
                                        <option value="3">Vendedor</option>
                                    </select>
                                </div>
                            </form>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" form="editUserForm" class="btn btn-primary">Guardar Cambios</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal para confirmación de eliminación de Usuario -->
            <div class="modal fade" id="exampleModal2" tabindex="-1" aria-labelledby="deleteUserModalLabel"
                 aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="deleteUserModalLabel">Eliminar proveedor</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>¿Estás seguro de que deseas eliminar este Usuario? Esta acción no se puede deshacer.</p>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                            <form id="deleteUserForm" method="post">
                                <button type="submit" class="btn btn-danger">Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>
</body>

<script>
    function validarPassword() {
        var password = document.getElementById("registro-password").value;
        var password2 = document.getElementById("registro-password2").value;

        if (password !== password2) {
            alert("Las contraseñas deben ser iguales");
            return false; //Evita el envio del form
        }
        return true; //permite el envio del form cuando las contasenas son iguales

    }

    document.addEventListener('DOMContentLoaded', function () {
        // Manejar el botón de eliminación
        const deleteButtons = document.querySelectorAll('.product-action-delete');
        deleteButtons.forEach(button => {
            button.addEventListener('click', function () {
                const idUsuario = this.getAttribute('data-id');
                const form = document.querySelector('#deleteUserForm');
                form.setAttribute('action', `/registrousuario/eliminar/${idUsuario}`);
            });
        });

        // Manejar el botón de edición
        const editButtons = document.querySelectorAll('.product-action-edit');
        editButtons.forEach(button => {
            button.addEventListener('click', function () {
                const idUsuario = this.getAttribute('data-id');
                fetch(`/registrousuario/${idUsuario}`)
                    .then(response => response.json())
                    .then(usuario => {
                        // Configurar datos en el modal
                        document.querySelector('#editIdUsuario').value = usuario.idUsuario;
                        document.querySelector('#editNombreUsuario').value = usuario.nombreUsuario;
                        document.querySelector('#editEmailUsuario').value = usuario.email;
                        document.querySelector('#editPasswordUsuario').value = '';
                        document.querySelector('#editRolUsuario').value = usuario.idRol.idRol;
                        // document.querySelector('#editPasswordUsuario').value = usuario.password;

                        // Configurar la acción del formulario
                        const form = document.querySelector('#editUserForm');
                        form.setAttribute('action', `/registrousuario/editar/${idUsuario}`);
                    });
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</html>
